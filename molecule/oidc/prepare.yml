---
- name: Prepare Outline OIDC Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Outline OIDC Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Outline OIDC Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    - name: Ensure Docker is installed for Outline OIDC Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs

    - name: Ensure the Outline Molecule OIDC stub directory exists
      ansible.builtin.file:
        path: "{{ outline_molecule_stub_path }}"
        state: directory
        mode: "0755"

    # Mounted into the stub container rather than baked into an image, so that
    # the scenario needs no image build and no registry of its own.
    - name: Ensure the Outline Molecule OIDC stub is installed
      ansible.builtin.copy:
        src: oidc-stub.js
        dest: "{{ outline_molecule_stub_path }}/oidc-stub.js"
        mode: "0644"
