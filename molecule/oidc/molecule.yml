---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: outline-${MOLECULE_DISTRO:-ubuntu2604}-oidc
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        outline_debug_service_enabled: false

        # The throwaway OpenID Connect provider that this scenario signs in
        # against. It runs on the container network the role creates, so
        # Outline reaches it by container name.
        outline_molecule_stub_container_name: outline-molecule-oidc-stub
        outline_molecule_stub_port: 9000
        outline_molecule_stub_base_url: "http://{{ outline_molecule_stub_container_name }}:{{ outline_molecule_stub_port }}"
        outline_molecule_stub_path: /outline-molecule-stub

        # The account the stub describes, which is what Outline provisions.
        outline_molecule_expected_email: molecule@example.com
        outline_molecule_expected_name: Molecule User

        # Variables for Outline
        outline_uid: 1000
        outline_gid: 1000
        outline_scheme: http
        outline_hostname: localhost
        outline_container_labels_traefik_enabled: false
        outline_container_http_host_bind_port: 3000
        # Outline wants 64 hexadecimal characters here, not merely 64
        # characters, and exits with `SECRET_KEY must be a hexadecimal number`
        # given anything else.
        outline_environment_variable_secret_key: 7d2f4a9c1e8b350647a2c9f1d5b8e036a4c7f291d8b3e560a9c2f4d7b1e805a3
        outline_environment_variable_utils_secret: 2b6e9d4a7f1c83052e9b6d4a7f1c8305b2e6d9a4f7c1385026b9e4d7a1f5c830
        outline_environment_variable_url: http://localhost:3000

        # Variables for the generic OpenID Connect sign-in provider. The
        # client ID and secret are set in `vars/oidc_credentials.yml"` instead, out
        # of reach of Molecule's variable expansion.
        outline_environment_variable_oidc_auth_uri: "{{ outline_molecule_stub_base_url }}/authorize"
        outline_environment_variable_oidc_token_uri: "{{ outline_molecule_stub_base_url }}/token"
        outline_environment_variable_oidc_userinfo_uri: "{{ outline_molecule_stub_base_url }}/userinfo"
        outline_environment_variable_oidc_username_claim: preferred_username

        # A name that Outline has no reason to produce on its own, so finding
        # it on the sign-in provider list is this variable reaching the
        # running process rather than a default being echoed back.
        outline_environment_variable_oidc_display_name: Molecule OIDC

        # Variables required for Outline to connect to the Postgres database (via Unix socket)
        outline_database_username: my_database_username
        outline_database_password: my_database_password
        outline_database_sslmode: disable
        outline_database_name: outline
        outline_database_socket_enabled: true
        outline_database_socket_path_host: "{{ postgres_run_path }}"
        outline_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables required for Outline to connect to the Valkey data-store (via Unix socket)
        outline_redis_socket_enabled: true
        outline_redis_socket_path_host: "{{ valkey_run_path }}"
        outline_systemd_required_services_list_custom:
          - "{{ valkey_identifier }}.service"

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_container_unix_socket_enabled: true
        postgres_managed_databases: |
          {{
            [{
              'name': outline_database_name,
              'username': outline_database_username,
              'password': outline_database_password,
            }]
          }}

        # Variables for Valkey
        valkey_uid: 1000
        valkey_gid: 1000
        valkey_arch: amd64
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
