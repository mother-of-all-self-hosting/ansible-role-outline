# The throwaway OpenID Connect credentials that this scenario configures
# Outline with.
#
# They live in this file rather than in `molecule.yml`, because Molecule
# expands anything that looks like an environment variable in `molecule.yml`.
# The client secret below carries dollar signs on purpose - identity providers
# hand out secrets like that, and the value has to survive Ansible, the `env`
# file this role templates and Docker's `--env-file` parsing untouched. The
# stub provider refuses to issue a token unless what Outline sends it matches
# byte for byte, so the sign-in in `verify.yml` is what confirms that.
#
# `converge.yml` and `verify.yml` read this file with `include_vars`, which
# interpolates nothing.

outline_environment_variable_oidc_client_id: outline-molecule-client-id
outline_environment_variable_oidc_client_secret: 'outline-molecule$client$secret'
